# WARNING: These are default passwords for development/testing only.
# For production use, generate strong random passwords:
#   mysql-root-password: $(openssl rand -base64 32)
#   seafile-admin-password: $(openssl rand -base64 16)
apiVersion: v1
kind: Secret
metadata:
  name: seafile-secrets
  namespace: seafile
type: Opaque
stringData:
  mysql-root-password: "db_root_password"
  seafile-admin-email: "admin@seafile.local"
  seafile-admin-password: "admin_password"
